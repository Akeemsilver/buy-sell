<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#741b47">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="B-RUIZ">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>try{var th=JSON.parse(localStorage.getItem("buy-sell-pref:theme"));if(th==="light"||th==="dark")document.documentElement.setAttribute("data-theme",th)}catch(e){}</script>
  <script src="js/theme.js"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>B-RUIZ Tienda Online</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="appbar">
    <img id="brand" class="brand" src="icons/logo.png" alt="B-RUIZ Tienda Online"><span id="brandtxt" class="brand brandtxt" hidden></span>
    <button id="back" class="icon-btn" aria-label="Back" hidden>‹</button>
    <h1 id="title">Home</h1>
    <span id="appbar-right"></span>
  </header>
  <main id="view"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="actionbar" class="actionbar" hidden></div>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <div id="scrim" class="scrim" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></section>
  <section id="viewer" class="viewer" aria-label="Photo" hidden><button class="vx" data-act="viewer-close" aria-label="Close">✕</button><div class="vstage"><img alt="" draggable="false"></div></section>
  <section id="gate" class="gate" hidden></section>
  <section id="editor" class="editor" aria-label="Photo" hidden></section>
  <input type="file" id="file" hidden>
  <script src="js/logic.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/photo.js"></script>
  <script src="js/photostore.js"></script>
  <script src="js/reader.js"></script>
  <script src="js/photoui.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/app.js"></script>
  <div id="update" class="update" role="alert" hidden><span id="update-t"></span><button id="update-b" type="button"></button></div>
  <script>
    // Offline support + updates: look for a new version on open, when you come back to the app and every 10 minutes.
    // When one is ready a bar appears at the bottom with an Update button; nothing reloads until you press it.
    if ('serviceWorker' in navigator) {
      var pressed = false;
      // The page that is already open may be an older version without these texts, so the bar carries its own copy.
      var FALLBACK = { en: { 'upd.available': 'Update available', 'upd.btn': 'Update', 'upd.updating': 'Updating…' }, es: { 'upd.available': 'Actualización disponible', 'upd.btn': 'Actualizar', 'upd.updating': 'Actualizando…' } };
      var tx = function (k) {
        var v = window.I18n ? I18n.t(k) : k; if (v !== k) return v;
        var l = (document.documentElement.lang || 'en').slice(0, 2); return (FALLBACK[l] || FALLBACK.en)[k];
      };
      var showUpdate = function (worker) {
        var bar = document.getElementById('update'); if (!bar || !bar.hidden) return;
        document.getElementById('update-t').textContent = tx('upd.available');
        var b = document.getElementById('update-b'); b.textContent = tx('upd.btn');
        b.onclick = function () { pressed = true; b.disabled = true; b.textContent = tx('upd.btn') + '…'; worker.postMessage('skip-waiting'); };
        bar.hidden = false;
      };
      navigator.serviceWorker.addEventListener('controllerchange', function () { if (pressed) location.reload(); });
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
        var watch = function (w) { w.addEventListener('statechange', function () { if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(w); }); };
        if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
        reg.addEventListener('updatefound', function () { if (reg.installing) watch(reg.installing); });
        var check = function () { reg.update().catch(function () {}); };
        document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
        window.addEventListener('online', check);
        setInterval(check, 10 * 60 * 1000);
      }).catch(function () {});
    }
  </script>
</body>
</html>

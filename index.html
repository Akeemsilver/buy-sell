<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#741b47">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="B-RUIZ">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>try{var th=JSON.parse(localStorage.getItem("buy-sell-pref:theme"));if(th==="light"||th==="dark")document.documentElement.setAttribute("data-theme",th)}catch(e){}</script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>B-RUIZ Tienda Online</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="appbar">
    <img id="brand" class="brand" src="icons/logo.png" alt="B-RUIZ Tienda Online">
    <button id="back" class="icon-btn" aria-label="Back" hidden>‹</button>
    <h1 id="title">Home</h1>
    <span id="appbar-right"></span>
  </header>
  <main id="view"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="actionbar" class="actionbar" hidden></div>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <div id="scrim" class="scrim" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></section>
  <input type="file" id="file" hidden>
  <script src="js/logic.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Offline support + automatic updates: look for a new version on open, when you come back to the app and every
    // 10 minutes. When one takes over, reload into it (waiting while you are typing or a pop-up is open).
    if ('serviceWorker' in navigator) {
      var hadController = !!navigator.serviceWorker.controller, reloading = false;
      var say = function (m) { var t = document.getElementById('toast'); if (t) { t.textContent = m; t.classList.add('show'); } };
      var safeNow = function () {
        var a = document.activeElement, typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
        return !typing && document.getElementById('sheet').hidden;
      };
      var applyUpdate = function () {
        if (reloading) return;
        if (safeNow()) { reloading = true; say(window.I18n ? I18n.t('upd.updating') : 'Updating…'); setTimeout(function () { location.reload(); }, 600); }
        else setTimeout(applyUpdate, 1500);          // try again once the pop-up is closed / typing has stopped
      };
      navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadController) applyUpdate(); });
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
        var check = function () { reg.update().catch(function () {}); };
        document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
        window.addEventListener('online', check);
        setInterval(check, 10 * 60 * 1000);
      }).catch(function () {});
    }
  </script>
</body>
</html>
